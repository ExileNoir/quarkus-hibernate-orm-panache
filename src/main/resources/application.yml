quarkus :
  datasource :
    db-kind : mysql
    username : root
    password : root
    jdbc:
      url : jdbc:mysql://localhost:3306/my_db_movie
  hibernate-orm :
    database :
      generation : update

"%test" :
  quarkus :
    datasource :
      db-kind : h2
      jdbc:
        url : jdbc:h2:mem:db
    hibernate-orm :
      dialect : org.hibernate.dialect.H2Dialect
      sql-load-script : META-INF/sql/import-test.sql
      database :
        generation : drop-and-create
    http :
      port : 9090
