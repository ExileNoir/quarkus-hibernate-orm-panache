quarkus :
  datasource :
    username : root
    password : root
    jdbc:
      url : jdbc:mysql://localhost:3306/my_db_movie
    db-kind : mysql
  hibernate-orm :
    database :
      generation : update

"%test" :
  quarkus :
    datasource :
      jdbc:
        url : jdbc:h2:mem:db
      db-kind : h2
    hibernate-orm :
      dialect : org.hibernate.dialect.H2Dialect
      sql-load-script : META-INF/sql/import-test.sql
      database :
        generation : drop-and-create
    http :
      port : 9090
